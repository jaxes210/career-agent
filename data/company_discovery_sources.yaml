# 自动发现源注册表。只启用已经有只读解析器和测试的公开来源。
sources:
  - id: qq_docs_27_autumn
    adapter: qq_docs_27_autumn
    enabled: true
    source_url: https://docs.qq.com/smartsheet/DY3pHYkNvb0ZRSHdi?tab=t0gmEC&viewId=vUQPXH
    source_type: 2027届校招公开汇总
    # 该表以软件/互联网岗位为主。已在正式池/既有候选池的企业继续更新；
    # 新企业只有名称或历史真实岗位提供化工、材料、工艺等证据时才进入候选池。
    admission:
      company_name_pattern: 化学|化工|石化|石油|煤化工|能源|材料|新材|电池|新能源|催化|环保|环境|水务|制药|医药|生物|日化|涂料|树脂|橡胶|轮胎|研究院|研究所|钢铁|矿业|有色|冶金|食品|乳业|饮料|再生
      historical_title_pattern: 催化|化工工艺|工艺研发|研发工艺|材料研发|材料工程|有机材料|高分子|化学分析|理化检测|配方(?:研发|工程|技术|师)|表面活性剂|水处理|环保技术|环境工程|电化学|电池材料|检测技术|生产技术|工艺工程师|工艺技术|制程技术
      excluded_title_pattern: 算法|软件|大模型|模型.*优化|推理优化|训练优化|数据质量|代码质量|网络质量|安全检测|软件测试|游戏|智能化|训练数据
      company_allowlist:
        - 三棵树
        - 宁德时代
        - 嘉士伯
        - 徐福记
        - 高露洁

