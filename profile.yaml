- 质量检测与实验室技术
- 材料制备及应用研发
- 产品技术支持与技术管理
skills:
- 实验设计与变量控制
- 催化材料制备及性能评价
- 反应条件优化
- 重复性验证与稳定性分析
- 失活及再生评价
- 科研数据处理与论文写作
- 胶体界面与纳米材料实验研究
project_evidence:
- P-CoSPc/Al₂O₃光辅助PMS体系：催化材料制备、负载比例优化、体系设计、条件筛选和动力学分析
- 催化剂循环稳定性、失活及光辅助再生评价；结构性能关联分析
- XRD、XPS、FTIR、SEM、BET、EPR表征数据分析；UV-Vis、HPLC-UV、TOC、ICP及电化学相关实验与数据分析（具体仪器操作层级待核实）
- 山东大学交换培养：多酚相关黑色素样纳米颗粒合成条件与配比优化、分散稳定性、TEM与DLS及粒径分布分析
- 科研论文写作及审稿意见回复
learning_targets:
