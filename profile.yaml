target_cohort: 2027
directions:
- 工业催化与催化剂研发
- 化工工艺与工艺技术
- 化工生产技术与技术支持
- 化学品与功能材料研发
- 化工实验与理化分析
- 工艺优化与技术研发
secondary_directions:
- 环保技术与工业水处理
- 新能源与电池材料
